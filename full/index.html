  --leaf:#7BC596; --leaf-ink:#0E1912; --leaf-soft:#1D3325;
  --timber:#AB8865; --soil:#1F261F; --soil-line:#3A4338;
  --frost:#82BBE2; --frost-soft:#162836;
  --alert:#F28C7A; --alert-soft:#3A1E19;
  --warn:#E5BB57; --warn-soft:#322812;
  --on-fam:#111713; --hatch:rgba(14,20,16,.30); --scrim:rgba(0,0,0,.6);
  --fam-potatoes:#CDA661; --fam-legumes:#79AF77; --fam-brassicas:#71A6B0; --fam-roots:#DB8C58;
  --fam-alliums:#B597CC; --fam-cucurbits:#DDB644; --fam-solanaceae:#D47669; --fam-salads:#ADCA7F;
  --fam-herbs:#5FB394; --fam-flowers:#DA98B3; --fam-other:#AAA397;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111713; --sheet:#19211B; --sheet-2:#151C17;
  --ink:#E3E9E2; --ink-2:#B0BBAF; --ink-3:#88947F;
  --rule:#28322A; --rule-2:#3A463C;
  --leaf:#7BC596; --leaf-ink:#0E1912; --leaf-soft:#1D3325;
  --timber:#AB8865; --soil:#1F261F; --soil-line:#3A4338;
  --frost:#82BBE2; --frost-soft:#162836;
  --alert:#F28C7A; --alert-soft:#3A1E19;
  --warn:#E5BB57; --warn-soft:#322812;
  --on-fam:#111713; --hatch:rgba(14,20,16,.30); --scrim:rgba(0,0,0,.6);
  --fam-potatoes:#CDA661; --fam-legumes:#79AF77; --fam-brassicas:#71A6B0; --fam-roots:#DB8C58;
  --fam-alliums:#B597CC; --fam-cucurbits:#DDB644; --fam-solanaceae:#D47669; --fam-salads:#ADCA7F;
  --fam-herbs:#5FB394; --fam-flowers:#DA98B3; --fam-other:#AAA397;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
body.drawer-open{overflow:hidden}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.2vw,40px);letter-spacing:-.025em;line-height:1.04;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
h3,.eyebrow{font-family:var(--f-mono);font-weight:500;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:12.5px}
.muted{color:var(--ink-3)}
.hint{font-size:13px;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
a{color:var(--leaf)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:8px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding-block:10px;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.015em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-pill{font-family:var(--f-mono);font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf);margin-left:6px}
.save-pill.local{background:var(--warn-soft);color:var(--warn)}
.save-pill.bad{background:var(--alert-soft);color:var(--alert)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--ink-2);padding:17px 11px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--leaf)}
@media (max-width:860px){.tabs{margin-left:-6px;width:calc(100% + 6px)}.tab{padding:8px 9px 10px}.brand{padding-block:10px 0}}
#banner{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--rule)}
#banner .wrap{padding-block:10px;font-size:14px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
main{padding-block:22px 72px}

.btn{appearance:none;font:inherit;font-weight:700;font-size:14px;line-height:1.2;border-radius:8px;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink);padding:8px 13px;min-height:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn-primary:hover{border-color:var(--ink)}
.btn-danger{color:var(--alert);border-color:var(--alert-soft)}
.btn-danger.armed{background:var(--alert);color:var(--sheet);border-color:var(--alert)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--leaf)}
.btn-sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn-lg{min-height:46px;padding:10px 20px;font-size:16px}
.icon-btn{appearance:none;border:1px solid transparent;background:none;color:var(--ink-3);font:inherit;font-size:12.5px;font-weight:700;padding:4px 7px;border-radius:6px;cursor:pointer;white-space:nowrap}
.icon-btn:hover{color:var(--ink);border-color:var(--rule-2)}
.icon-btn.armed{color:var(--alert);border-color:var(--alert)}
.linkish{appearance:none;border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:7px;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--leaf)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--sheet-2);border:1px solid var(--rule-2);border-radius:8px;padding:7px 10px;min-height:40px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--leaf);margin:0;flex:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.label{font-size:13px;font-weight:700;color:var(--ink-2)}
.check-line{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
fieldset{border:1px solid var(--rule);border-radius:10px;padding:12px 14px 14px;margin:0;min-width:0}
legend{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}
@media (max-width:600px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:auto}}

.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;min-width:0}
.panel>*+*{margin-top:14px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:920px){.split{grid-template-columns:minmax(0,1fr)}}
.view-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.view-head .lead{max-width:62ch;color:var(--ink-2);margin-top:8px}
.callout{padding:10px 12px;border-radius:8px;font-size:14px;background:var(--sheet-2);border:1px solid var(--rule)}
.callout.warn{background:var(--warn-soft);border-color:transparent}
.callout.frost{background:var(--frost-soft);border-color:transparent}
.empty{padding:32px 20px;text-align:center;color:var(--ink-2)}
.empty h2{margin-bottom:6px}
.empty .btn{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);font-size:13.5px;color:var(--ink-2)}
.stat b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-size:14px}
button.stat{font:inherit;font-size:13.5px;cursor:pointer}
button.stat.alert{border-color:var(--alert);color:var(--alert)}
.meter{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:6px;max-width:320px}
.meter span{display:block;height:100%;background:var(--leaf);border-radius:99px}

/* welcome + wizard */
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:20px 8px}
@media (max-width:860px){.welcome{grid-template-columns:minmax(0,1fr)}}
.welcome h1{font-size:clamp(34px,6vw,58px)}
.welcome .lead{font-size:17px;color:var(--ink-2);max-width:52ch;margin-top:14px}
.welcome .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.feature-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.feature-list li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.feature-list b{display:block}
.feature-list i{width:20px;height:20px;border-radius:4px;display:block;margin-top:2px;background:var(--fam)}
.steps{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps button{appearance:none;width:100%;text-align:left;border:0;border-top:4px solid var(--rule-2);background:none;padding:8px 2px 0;font:inherit;cursor:pointer;color:var(--ink-3)}
.steps button b{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500}
.steps button span{display:block;font-weight:700;font-size:14px;line-height:1.2}
.steps button.done{border-top-color:var(--leaf);color:var(--ink-2)}
.steps button[aria-current="step"]{border-top-color:var(--ink);color:var(--ink)}
@media (max-width:600px){.steps button span{font-size:11.5px}}
.wiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.spaces-tbl{width:100%;border-collapse:collapse;min-width:760px}
.spaces-tbl th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:6px 6px;border-bottom:2px solid var(--ink);white-space:nowrap}
.spaces-tbl td{padding:6px;border-bottom:1px solid var(--rule);vertical-align:middle}
.spaces-tbl input[type=number]{width:84px}
.spaces-tbl select{width:auto}
.add-several{display:grid;grid-template-columns:70px minmax(0,1fr) 90px 90px minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:760px){.add-several{grid-template-columns:repeat(2,minmax(0,1fr))}.add-several .btn{grid-column:1/-1}}
.crop-fam+.crop-fam{margin-top:18px}
.crop-fam h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.crop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px;align-items:start}
.crop-row{border:1px solid var(--rule);border-radius:9px;padding:8px 10px;background:var(--sheet);min-width:0}
.crop-row.on{border-color:var(--leaf);box-shadow:inset 3px 0 0 var(--leaf);background:var(--sheet-2)}
.crop-pick{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.crop-pick b{display:block;line-height:1.25}
.crop-pick small{display:block;font-size:12px;color:var(--ink-3)}
.crop-opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin-top:8px}
.crop-opts .field:first-child{grid-column:1/-1}
.crop-opts .field>label{font-size:11.5px}
.crop-opts .btn{grid-column:1/-1;justify-self:start}
.sum-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.sum-list div{background:var(--sheet-2);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.sum-list b{font-family:var(--f-mono);font-weight:500;font-size:22px;display:block;line-height:1.1}

/* week */
.week-hero{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.week-hero .sub{margin-top:8px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.frost-note{color:var(--frost);font-weight:700}
.weeknav{display:flex;gap:6px;align-items:center}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--rule)}
.item:first-child{border-top:0}
.item input{margin-top:2px}
.item-text{cursor:pointer;font-weight:700;line-height:1.35}
.item.is-done .item-text{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.item-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.item-actions{grid-column:3;grid-row:1/span 2;display:flex;gap:2px}
.group+.group{margin-top:18px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:2px}
.group-h.overdue{border-bottom-color:var(--alert)}
.group-h.overdue h3{color:var(--alert)}
.kind{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:1px 6px;border-radius:4px;background:var(--rule);color:var(--ink-2)}
.kind-sow{background:var(--leaf-soft);color:var(--leaf)}
.kind-plant{background:var(--leaf);color:var(--leaf-ink)}
.kind-harvest{background:var(--fam-cucurbits);color:var(--on-fam)}
.kind-clear{background:var(--soil);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--soil-line)}
.kind-job{background:transparent;box-shadow:inset 0 0 0 1px var(--rule-2)}
.bedchip{font-family:var(--f-mono);font-size:11.5px;font-weight:500;padding:0 6px;border:1.5px solid var(--timber);color:var(--timber);border-radius:4px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--fam)}
.flag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.flag-frost{background:var(--frost-soft);color:var(--frost)}
.flag-clash{background:var(--alert-soft);color:var(--alert)}
.flag-rot{background:var(--warn-soft);color:var(--warn)}
.flag-ok{background:var(--leaf-soft);color:var(--leaf)}
.add-job{display:grid;grid-template-columns:minmax(0,1fr) 150px 130px auto;gap:8px;margin-top:12px}
@media (max-width:640px){.add-job{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.add-job #job-text{grid-column:1/-1}.add-job .btn{grid-column:1/-1}}
.plain{list-style:none;margin:0;padding:0}
.plain>li{padding:8px 0;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.plain>li:first-child{border-top:0}
.plain .grow{flex:1 1 160px;min-width:0}

/* map */
.plot{display:flex;flex-direction:column;gap:18px}
.plot-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.plot.narrow .plot-row{grid-template-columns:minmax(0,1fr);gap:6px}
.row-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:2px;line-height:1.3;overflow-wrap:anywhere}
.row-beds{display:flex;flex-wrap:wrap;gap:14px 12px;align-items:flex-start;min-width:0}
.bed-wrap{display:flex;flex-direction:column;gap:4px;max-width:100%}
.bed{appearance:none;padding:3px;border:3px solid var(--timber);border-radius:3px;background:var(--soil);cursor:pointer;display:flex;font:inherit;color:var(--on-fam);max-width:100%;transition:transform .12s ease}
.bed:hover{transform:translateY(-1px)}
.bed.t-cover{border-style:double;border-width:5px;border-color:var(--ink-3)}
.bed.t-pots{border-radius:12px;border-color:var(--ink-3)}
.bed.t-ground{border-style:dotted}
.bed.is-sel{outline:3px solid var(--leaf);outline-offset:3px}
.bed.unbuilt{border:2px dashed var(--rule-2);background:transparent;color:var(--ink-3);align-items:center;justify-content:center;font-size:11px;font-weight:700}
.strips{display:flex;gap:2px;flex:1;min-width:0;min-height:0}
.strips.rows{flex-direction:column}
.seg{flex:1 1 0;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--fam);border-radius:2px;overflow:hidden}
.seg.free{background:transparent;box-shadow:inset 0 0 0 1px var(--soil-line);color:var(--ink-3)}
.seg.harvest{background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--hatch) 5px 7px)}
.seg.clash{box-shadow:inset 0 0 0 2px var(--alert)}
.seg-t{font-size:10.5px;font-weight:700;line-height:1.05;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.strips.cols .seg-t{writing-mode:vertical-rl;transform:rotate(180deg);max-height:100%;max-width:none;padding:3px 0}
.plot.mini .seg-t{font-size:9.5px}
.bed-cap{display:flex;flex-wrap:wrap;column-gap:6px;row-gap:0;align-items:baseline;font-size:12px;max-width:100%;line-height:1.25}
.bed-cap b{font-family:var(--f-display);font-weight:800;font-size:14.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed-cap span{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:12px;border-radius:2px;background:var(--fam);display:inline-block}
.sw.harvest{background-color:var(--fam-other);background-image:repeating-linear-gradient(135deg,transparent 0 3px,var(--hatch) 3px 5px)}
.sw.free{background:var(--soil);box-shadow:inset 0 0 0 1px var(--soil-line)}
.sw.unbuilt{background:transparent;border:1.5px dashed var(--rule-2)}
.slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.slider input[type=range]{width:100%;accent-color:var(--leaf);margin:0}
.ticks{position:relative;height:16px;margin:2px 0 0;grid-column:2}
.ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.ticks .t-short{display:none}
@media (max-width:640px){.ticks .t-long{display:none}.ticks .t-short{display:inline}}
.plot-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.bp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bp-actions{display:flex;gap:6px;flex-wrap:wrap}
.facts{display:grid;gap:8px;margin:0}
.facts div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;font-size:14px}
.facts dt{color:var(--ink-3);font-size:13px}
.facts dd{margin:0}

/* timeline */
.tl-scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);max-width:100%}
.tl{position:relative;width:max-content}
.tl-head{display:flex;border-bottom:1px solid var(--rule-2)}
.tl-months{display:flex}
.tl-m{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);padding:4px 4px 2px;border-left:1px solid var(--rule-2);white-space:nowrap;overflow:hidden}
.tl-days{display:flex}
.tl-days span{font-family:var(--f-mono);font-size:9px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.tl-lab{position:sticky;left:0;z-index:5;background:var(--sheet);width:var(--lab);flex:none;border-right:1px solid var(--rule-2);padding:3px 8px;display:flex;flex-direction:column;justify-content:center;line-height:1.15;overflow:hidden}
.tl-lab b{font-family:var(--f-display);font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-lab small{font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
.tl-bed{display:flex;border-top:1px solid var(--rule-2)}
.tl-track{position:relative;flex:none;cursor:copy;background-image:linear-gradient(to right,var(--rule) 1px,transparent 1px),linear-gradient(to bottom,var(--rule) 1px,transparent 1px);background-size:var(--cw) 100%,100% var(--rh)}
.tl-bed.unbuilt .tl-track{background-color:var(--sheet-2)}
.tl-bed.unbuilt .tl-lab b{color:var(--ink-3)}
.bar{position:absolute;appearance:none;border:0;padding:0 5px;margin:0;border-radius:4px;background:var(--fam);color:var(--on-fam);font:inherit;font-size:11px;font-weight:700;line-height:1.1;text-align:left;overflow:hidden;cursor:pointer;display:flex;align-items:center;z-index:2;box-shadow:inset 0 0 0 1px var(--hatch)}
.bar:hover{z-index:3;filter:saturate(1.2)}
.bar.cut-l{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cut-r{border-top-right-radius:0;border-bottom-right-radius:0}
.bar.is-clash{box-shadow:0 0 0 2px var(--alert)}
.bar.is-failed{opacity:.45}
.bar-h{position:absolute;top:0;bottom:0;right:0;background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--hatch) 4px 6px);pointer-events:none}
.bar-t{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nursery{position:absolute;height:0;border-top:2px dotted var(--fam);z-index:1;pointer-events:none}
.tl-now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--alert);z-index:4;pointer-events:none}
.tl-frost{position:absolute;top:0;bottom:0;border-left:2px dashed var(--frost);z-index:1;pointer-events:none}
.tl-scroll.compact .tl-m{font-size:9.5px;padding:2px 2px 1px}
.tl-scroll.compact .bar{font-size:9.5px;padding:0 3px}

.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.tbl th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td.d{font-family:var(--f-mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.is-failed td{color:var(--ink-3)}
.tbl .sub{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--rule);color:var(--ink-2)}
.st-sown{background:var(--leaf-soft);color:var(--leaf)}
.st-in{background:var(--leaf);color:var(--leaf-ink)}
.st-harvesting{background:var(--fam-cucurbits);color:var(--on-fam)}
.st-finished{background:transparent;box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-3)}
.st-failed{background:var(--alert-soft);color:var(--alert)}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:700px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .q{grid-column:1/-1}}

.seg-tabs{display:inline-flex;border:1px solid var(--rule-2);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg-tabs button{appearance:none;border:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink-2);padding:6px 11px;border-radius:7px;cursor:pointer}
.seg-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.note{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;border-top:4px solid var(--rule-2)}
.note.k-failure{border-top-color:var(--alert)}
.note.k-success{border-top-color:var(--leaf)}
.note.k-idea{border-top-color:var(--frost)}
.note-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.note-t{font-weight:700;font-size:16px;line-height:1.3}
.note p{font-size:14px;color:var(--ink-2)}
.note p b{color:var(--ink)}
.note footer{display:flex;gap:2px;justify-content:flex-end;margin-top:auto}

#drawer{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--sheet);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer-panel{animation:none}.bed{transition:none}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--rule)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:16px}
.drawer-foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--rule);flex-wrap:wrap;align-items:center}
.drawer-foot .spacer{flex:1}
.strip-pick{display:flex;gap:4px;flex-wrap:wrap}
.sp{appearance:none;flex:1 1 64px;min-width:58px;border:1px solid var(--rule-2);background:var(--sheet-2);border-radius:7px;padding:6px 7px;font:inherit;font-size:12px;line-height:1.25;text-align:left;cursor:pointer;color:var(--ink-2)}
.sp b{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink)}
.sp.is-on{border-color:var(--leaf);box-shadow:inset 0 0 0 2px var(--leaf);background:var(--leaf-soft)}
.sp.busy small{color:var(--alert);font-weight:700}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:baseline;padding:8px 11px;border-radius:8px;font-size:14px;background:var(--sheet-2)}
.check .flag{flex:none}
.fam-chips{display:flex;flex-wrap:wrap;gap:6px}
.fam-chips label{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--rule-2);border-radius:999px;font-size:13px;cursor:pointer}
.code-box{font-family:var(--f-mono);font-size:12px;min-height:220px}

/* shorter planting form */
details.more{border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
details.more>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:0;height:0;border-left:6px solid var(--ink-3);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s;align-self:center}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary .hint{font-weight:400}
.more-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.step-togs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step-tog{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border:1px solid var(--rule-2);border-radius:9px;background:var(--sheet-2);font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer;text-align:center;padding:6px 8px;line-height:1.15}
.step-tog input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.step-tog input:checked+span::before{content:"✓ "}
.step-tog:has(input:checked){background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.step-tog:has(input:focus-visible){outline:2px solid var(--leaf);outline-offset:2px}
@media (max-width:480px){.step-togs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.date-sum{font-size:13.5px;color:var(--ink-2)}
/* one-tap progress */
.mark-btn{appearance:none;border:1px solid var(--leaf);background:var(--leaf-soft);color:var(--leaf);font:inherit;font-size:12.5px;font-weight:700;line-height:1.2;padding:4px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.mark-btn:hover{background:var(--leaf);color:var(--leaf-ink)}
.prog-cell{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.toast-undo{appearance:none;border:0;background:none;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;margin-left:10px;padding:2px 4px;cursor:pointer}
/* plantings list as cards on narrow screens */
@media (max-width:700px){
  .tbl.pl{min-width:0}
  .tbl.pl thead{display:none}
  .tbl.pl,.tbl.pl tbody,.tbl.pl tr{display:block}
  .tbl.pl tr{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--sheet)}
  .tbl.pl td{display:block;border:0;padding:3px 0}
  .tbl.pl td.d{display:inline-block;margin-right:14px}
  .tbl.pl td.d::before{content:attr(data-l) " ";font-family:var(--f-body);color:var(--ink-3);font-size:12px}
  .tbl.pl .prog-cell{flex-direction:row;flex-wrap:wrap;align-items:center}
}
/* bigger targets on touch screens */
@media (pointer:coarse){
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font-size:16px;min-height:46px}
  input[type=checkbox],input[type=radio]{width:24px;height:24px}
  .btn{min-height:44px;padding:10px 16px}
  .btn-sm{min-height:40px;padding:8px 13px}
  .icon-btn{padding:9px 11px;font-size:13.5px}
  .mark-btn{padding:9px 15px;font-size:14px}
  .item{padding:13px 0;gap:6px 14px}
  .item-text{font-size:16px}
  .tab{padding-top:14px;padding-bottom:14px}
  .sp{min-height:52px}
  .check-line{min-height:40px}
  .plain>li{padding:11px 0}
  details.more>summary{padding:15px 14px}
}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.fam-potatoes{--fam:var(--fam-potatoes)}.fam-legumes{--fam:var(--fam-legumes)}.fam-brassicas{--fam:var(--fam-brassicas)}.fam-roots{--fam:var(--fam-roots)}
.fam-alliums{--fam:var(--fam-alliums)}.fam-cucurbits{--fam:var(--fam-cucurbits)}.fam-solanaceae{--fam:var(--fam-solanaceae)}.fam-salads{--fam:var(--fam-salads)}
.fam-herbs{--fam:var(--fam-herbs)}.fam-flowers{--fam:var(--fam-flowers)}.fam-other{--fam:var(--fam-other)}
/* ---------- additions for the file-based planner ---------- */
html{-webkit-text-size-adjust:100%}
[hidden]{display:none !important}
body{margin:0}
.top .wrap{row-gap:0}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;padding-block:8px}
.top-actions .save-pill{font-size:11.5px;padding:3px 9px;margin:0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{margin-left:0;flex:1 1 100%;order:3}
@media (max-width:480px){.top-actions.has-act .save-pill{display:none}}
@media (max-width:640px){.month-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;padding-bottom:2px}.month-chips::-webkit-scrollbar{display:none}.mchip{flex:none}.top-actions .btn-sm{min-height:34px;padding:4px 9px}.top-actions .save-pill{max-width:150px}.brand small{max-width:44vw}}
.pin-dot{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:0 5px;border-radius:4px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
.alert-t{color:var(--alert);font-weight:700}
.import-card{display:flex;gap:16px 28px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px;border-left:5px solid var(--leaf)}
.import-card h2{margin-top:4px}.import-card .lead{max-width:80ch;color:var(--ink-2);margin-top:6px}
.sum-list small{display:block;font-size:12px;color:var(--ink-3)}
.sum-list span{display:block;font-size:13.5px;color:var(--ink-2)}

/* quick harvest */
.quick-h{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:520px){.quick-h{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.quick-h .field:first-child{grid-column:1/-1}.quick-h .btn{grid-column:1/-1}}

/* nursery panel: trays drawn as little trays */
.nloc+.nloc{margin-top:12px}
.nloc-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:4px}
.nloc.over .nloc-h{border-bottom-color:var(--alert)}
.tray-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tray-list li{display:flex;gap:10px;align-items:center;font-size:13.5px}
.trays{display:inline-flex;gap:3px;flex:none;min-width:58px}
.tray{display:inline-block;width:16px;height:11px;border-radius:2px;background-color:var(--fam);background-image:linear-gradient(90deg,transparent 3px,var(--hatch) 3px 4px),linear-gradient(transparent 3px,var(--hatch) 3px 4px);background-size:4px 4px;box-shadow:inset 0 0 0 1px var(--hatch)}
.tray.half{width:8px}

/* plot extras */
.bed-next{display:flex;flex-direction:column;font-size:11px;line-height:1.3;color:var(--ink-2)}
.bed-next b{font-weight:500;color:var(--leaf);font-size:10.5px;margin-right:2px}
.bed.soon{border-style:dashed}
.month-chips{display:flex;flex-wrap:wrap;gap:4px}
.mchip{appearance:none;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink-2);font:inherit;font-family:var(--f-mono);font-size:12px;padding:4px 8px;border-radius:6px;cursor:pointer;min-height:30px}
.mchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ycell{appearance:none;border:1px solid var(--rule);background:var(--sheet-2);border-radius:10px;padding:8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.ycell:hover{border-color:var(--leaf)}
.ycell-h{display:block;font-family:var(--f-display);font-weight:800;font-size:15px;margin:0 0 4px 2px}
.plot-svg{display:block;width:100%;height:auto;border-radius:6px}
.tl-unready{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--rule) 6px 7px);pointer-events:none}

/* nursery chart */
.cap-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.cap-form{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nchart-wrap{overflow-x:auto;max-width:100%;margin-top:10px}
.nchart{display:block}
.nchart .nc-lab{font:700 13px var(--f-body);fill:var(--ink)}
.nchart .nc-sub{font:400 11px var(--f-body);fill:var(--ink-3)}
.nchart .nc-m{font:500 10.5px var(--f-mono);fill:var(--ink-3)}
.nchart .nc-base{stroke:var(--rule-2)}
.nchart .nc-cap{stroke:var(--ink-2);stroke-dasharray:4 3}
.nchart .nc-now{stroke:var(--alert);stroke-width:2}
.nchart .nc-hit{fill:transparent;cursor:pointer}
.nchart .nc-col:hover .nc-hit{fill:var(--rule)}
.nchart .nc-col.sel .nc-hit{fill:var(--leaf-soft)}
.nchart .nc-bar{fill:var(--leaf)}
.nchart .nc-bar.over{fill:var(--alert)}
.nchart .nc-col{cursor:pointer}

/* crops */
.crop-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.crop-card{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--fam);border-radius:10px;padding:12px 14px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.crop-card header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.crop-card header .dot{align-self:center}
.crop-card footer{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-top:auto;border-top:1px solid var(--rule);padding-top:6px}
.crop-card .spacer,.drawer-foot .spacer{flex:1}

/* planting editor */
.drawer-panel.wide{width:min(720px,100%)}
.advice{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet-2);display:flex;flex-direction:column;gap:10px}
.advice-h{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.win-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.win{appearance:none;text-align:left;border:1px solid var(--rule-2);background:var(--sheet);border-radius:9px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:1px;line-height:1.25}
.win b{font-size:14px}
.win span{font-size:12.5px;color:var(--ink-2)}
.win small{font-size:11.5px;color:var(--ink-3)}
.win:hover{border-color:var(--leaf)}
.win.on{border-color:var(--leaf);box-shadow:inset 0 0 0 2px var(--leaf);background:var(--leaf-soft)}
.want-out{display:grid;grid-template-columns:auto minmax(140px,190px) auto;gap:6px 10px;align-items:center;font-size:13.5px}
.want-out label{font-weight:700;color:var(--ink-2)}
@media (max-width:560px){.want-out{grid-template-columns:minmax(0,1fr)}}
.date-grid{display:grid;gap:6px}
.date-row{display:grid;grid-template-columns:110px minmax(130px,170px) minmax(0,1fr);gap:4px 10px;align-items:center}
.date-row label{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.date-row[hidden]{display:none}
@media (max-width:520px){.date-row{grid-template-columns:96px minmax(0,1fr)}.date-row .pin-state{grid-column:2}}
.pin-state{display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.ps{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.ps.auto{background:var(--leaf-soft);color:var(--leaf)}
.ps.fixed{background:var(--warn-soft);color:var(--warn)}
.ps.done{background:var(--leaf);color:var(--leaf-ink)}
.nursery-line{font-size:13.5px;color:var(--ink-2);margin:0}
.nursery-line:empty{display:none}
.adv{display:grid;gap:8px;margin:0}
.adv div{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px;font-size:14px}
.adv dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.adv dd{margin:0}
@media (max-width:480px){.adv div{grid-template-columns:minmax(0,1fr);gap:2px}}
.ac-fam h3{display:flex;align-items:center;gap:6px;margin:14px 0 6px}
.ac-item{appearance:none;display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px;margin-bottom:4px;font:inherit;color:var(--ink);cursor:pointer}
.ac-item:hover{border-color:var(--leaf)}
.ac-item small{display:block;color:var(--ink-3);font-size:12px}
.fillers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fillers li{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:9px;padding:8px 10px}
.fillers .grow{flex:1;min-width:0}
.fillers .sub,.tbl .sub{display:block;font-size:12.5px;color:var(--ink-3)}
.cmp-maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cmp-maps figure{margin:0}.cmp-maps figcaption{font-weight:700;margin-bottom:4px}
@media (max-width:600px){.cmp-maps{grid-template-columns:minmax(0,1fr)}}
.tbl.cmp{min-width:0}.tbl.cmp th{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--rule);font-weight:700}
.tbl.nur{min-width:760px}

#print-area{display:none}

/* ---------- printing ---------- */
@media print{
  body.printing>*:not(#print-area){display:none !important}
  body.printing #print-area{display:block}
  body.printing{background:#fff;color:#000;font-size:11pt}

/* ---------- jobs ---------- */

/* ---------- free space ---------- */

/* gap fillers: crops whose sowing windows fit a free gap */
function fillersFor(bedId, s1, s2, from, to, limit){

  const st = D.settings, cover = b.type === "cover", prevF = prevFamilyIn(bedId, s1, s2, addWeeks(from, 1));
  const mine = new Set(Object.values(D.crops).map(c => c.lib).filter(Boolean));
  const cands = Object.values(D.crops).map(c => ({c, mine:true})).concat(LIB.filter(L => !mine.has(L.id)).map(L => ({c:libCrop(L.id), mine:false})));

    for(let i = 0; i < ws.length; i++){
      for(const yr of [0, 1, -1]){

/* ---------- automatic placing ---------- */
function areaNeed(p){ const want = has(p.plants) ? +p.plants : 0; const d = densityOf(p); return want && d ? want / d : +p.area || 0; }

function autoPlace(ids, opts){
  opts = opts || {};

  const list = ids.map(id => D.plantings[id]).filter(p => p && !placed(p) && occ(p) && densityOf(p) !== 0 && !p.failed && !(p.done || {}).plantOut && !(isDirect(methodOf(p)) && (p.done || {}).sow));

/* ---------- beds ---------- */
function bedsOrdered(){ return Object.values(D.beds).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), undefined, {numeric:true})); }

    const p = here[0] || null, clash = here.length > 1, last = segs[segs.length-1];

/* ---------- how much to grow ---------- */

  const crops = new Set(dm.crops || []);
  const ps = PL().filter(p => crops.has(p.crop) && !p.failed && inSeason(p));
  const yieldM2 = +dm.yield || (ps[0] ? +cv(cropOf(ps[0]), "y") : 0) || 2;
  const areaNeed = yieldM2 ? needKg / yieldM2 : 0;
  const areaPlan = ps.reduce((a, p) => a + areaOf(p), 0);

  const coverWeeks = Math.min(+dm.weeks || 52, freshWeeks + stored);

function setSettings(f){ const n = Object.assign({}, D.settings, f); if(sameRec(D.settings, n)) return; n.mt = nowMs(); D.settings = n; _wc.key = ""; }
function setMeta(f){ const n = Object.assign({}, D.meta, f); if(sameRec(D.meta, n)) return; n.mt = nowMs(); D.meta = n; }
/* every edit goes through change(): snapshot for undo, apply, re-derive linked dates, save, redraw */
function change(fn, msg, opts){
  const before = JSON.stringify(D);
  let res;
  try{ res = fn(); }catch(e){ D = JSON.parse(before); console.error(e); toast("Something went wrong: " + e.message); return; }
  const moved = recalcAll(); _an = null;
  if(JSON.stringify(D) === before) { render(); return res; }
  UNDO.push(before); if(UNDO.length > 50) UNDO.shift();
  saveSoon(); render();
  if(msg !== false){ const extra = moved && !(opts && opts.quietMoves) ? " · " + plural(moved, "planting") + " re-dated" : ""; toast((msg || "Saved") + extra, true); }
  return res;
}
function undo(){
  if(!UNDO.length){ toast("Nothing to undo"); return; }
  const prev = JSON.parse(UNDO.pop()), t = nowMs();
  /* touch everything that differs so the undo also wins when merged with other copies */
  for(const c of COLLS){ const ids = new Set(Object.keys(prev[c] || {}).concat(Object.keys(D[c] || {}))); for(const id of ids){ const a = (prev[c] || {})[id], b = D[c][id]; const sa = a ? JSON.stringify(Object.assign({}, a, {mt:0})) : "", sb = b ? JSON.stringify(Object.assign({}, b, {mt:0})) : ""; if(sa === sb) continue; if(a){ a.mt = t; delete prev.deleted[c + "/" + id]; } else prev.deleted[c + "/" + id] = t; } }
  if(JSON.stringify(Object.assign({}, prev.settings, {mt:0})) !== JSON.stringify(Object.assign({}, D.settings, {mt:0}))) prev.settings.mt = t;
  if(JSON.stringify(Object.assign({}, prev.meta, {mt:0})) !== JSON.stringify(Object.assign({}, D.meta, {mt:0}))) prev.meta.mt = t;
  D = prev; _wc.key = ""; _an = null; saveSoon(); render(); toast("Undone");
}

/* ---------- merging two copies of the plan, record by record ---------- */
function mergePlans(a, b){
  a = normalise(a); b = normalise(b);
  const out = normalise(a); let changes = 0;
  const del = Object.assign({}, a.deleted); for(const k in b.deleted) del[k] = Math.max(del[k] || 0, b.deleted[k]);
  out.deleted = del;
  for(const c of COLLS){
    const ids = new Set(Object.keys(a[c]).concat(Object.keys(b[c])));
    for(const id of ids){
      const ra = a[c][id], rb = b[c][id];
      let pick = !ra ? rb : !rb ? ra : ((+rb.mt || 0) > (+ra.mt || 0) ? rb : ra);
      const tomb = del[c + "/" + id];
      if(tomb && tomb >= (+(pick && pick.mt) || 0)) pick = null;
      if(pick) out[c][id] = Object.assign({}, pick, {id}); else delete out[c][id];
      if((pick ? JSON.stringify(pick) : "") !== (ra ? JSON.stringify(ra) : "")) changes++;
    }
  }
  for(const k of ["settings","meta"]){ if((+b[k].mt || 0) > (+a[k].mt || 0)){ out[k] = Object.assign({}, b[k]); changes++; } }
  out.savedAt = a.savedAt > b.savedAt ? a.savedAt : b.savedAt;
  return {plan:out, changes};
}
function serialize(){ const o = {app:APP_ID, format:FORMAT, savedAt:new Date().toISOString(), savedOn:deviceName(), meta:D.meta, settings:D.settings}; COLLS.forEach(c => o[c] = D[c]); o.deleted = D.deleted; return o; }
function deviceName(){ const u = navigator.userAgent || ""; return /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android phone" : /Mac/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows PC" : "computer"; }

/* ===================== files: the plan file in a folder (Chrome/Edge), working copy, phone open & save, merging ===================== */
const LS_WORK = "allotment-planner:working", LS_SYNC = "allotment-planner:sync";
const F = {mode:"none", dir:null, perm:"", folderName:"", stamp:0, saving:false, again:false, lastSaved:null, err:"", unsynced:false, savedToFilesAt:"", openedAt:"", lastSync:0};
const canFolder = () => typeof window.showDirectoryPicker === "function";
const isTouch = () => matchMedia("(pointer:coarse)").matches;

/* small IndexedDB key-value store (folder handles can only live here) */
function idb(){ return new Promise((res, rej) => { try{ const r = indexedDB.open("allotment-planner", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); }
async function kvGet(k){ try{ const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }catch(e){ return undefined; } }
async function kvSet(k, v){ try{ const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); return true; }catch(e){ return false; } }
async function kvDel(k){ try{ const db = await idb(); await new Promise(res => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }catch(e){} }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function syncInfoSave(){ lsSet(LS_SYNC, JSON.stringify({unsynced:F.unsynced, savedToFilesAt:F.savedToFilesAt, openedAt:F.openedAt, mode:F.mode})); }
function syncInfoLoad(){ try{ const o = JSON.parse(lsGet(LS_SYNC) || "{}"); F.unsynced = !!o.unsynced; F.savedToFilesAt = o.savedToFilesAt || ""; F.openedAt = o.openedAt || ""; return o; }catch(e){ return {}; } }
const planJSON = () => JSON.stringify(serialize(), null, 1);
const contentKey = d => { const n = normalise(d); const o = {meta:n.meta, settings:n.settings, deleted:n.deleted}; COLLS.forEach(c => o[c] = n[c]); return JSON.stringify(o); };

/* ---------- saving ---------- */
let wT = 0, fT = 0;
function saveSoon(){
  clearTimeout(wT); wT = setTimeout(saveWorking, 120);
  if(F.mode === "folder" && F.perm === "granted"){ clearTimeout(fT); fT = setTimeout(writeFolder, 600); F.pending = true; }
  else { F.unsynced = true; syncInfoSave(); }
  updateStatus();
}
function saveWorking(){ if(!D) return; const s = planJSON(); lsSet(LS_WORK, s); kvSet("working", s); }
function flushNow(){ if(wT){ clearTimeout(wT); wT = 0; saveWorking(); } if(F.pending && F.mode === "folder"){ clearTimeout(fT); writeFolder(); } }
window.addEventListener("pagehide", flushNow);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushNow(); else if(D) checkOutside(); });
window.addEventListener("focus", () => { if(D) checkOutside(); });

async function writeFolder(){
  if(!(F.mode === "folder" && F.dir && F.perm === "granted") || !D) return;
  if(F.saving){ F.again = true; return; }
  F.saving = true; F.pending = false; updateStatus();
  try{
    const fh = await F.dir.getFileHandle(PLAN_FILE, {create:true});
    const file = await fh.getFile();
    if(file.size && F.stamp && file.lastModified !== F.stamp){
      /* someone (the phone, another computer) saved over it since we last looked: merge first */
      const other = safeParse(await file.text());
      if(isPlan(other)){ const r = mergePlans(D, other); D = r.plan; recalcAll(); _an = null; if(r.changes){ toast("Brought in " + plural(r.changes, "change") + " saved on " + (other.savedOn || "another device")); render(); } }
    }
    if(file.size) await dailyBackup(file);
    const w = await fh.createWritable(); await w.write(planJSON()); await w.close();
    F.stamp = (await fh.getFile()).lastModified; F.lastSaved = new Date(); F.err = ""; F.unsynced = false; syncInfoSave();
    saveWorking();
  }catch(e){
    F.err = e && e.message || String(e);
    if(e && (e.name === "NotAllowedError" || e.name === "SecurityError")) F.perm = "prompt";
    if(e && e.name === "NotFoundError"){ F.perm = "lost"; }
  }
  F.saving = false; updateStatus();
  if(F.again){ F.again = false; writeFolder(); }
}
async function dailyBackup(file){
  try{
    const bd = await F.dir.getDirectoryHandle("backups", {create:true});
    const name = "allotment-plan " + todayISO + ".json";
    try{ await bd.getFileHandle(name); return; }catch(e){}
    const fh = await bd.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(await file.text()); await w.close();
    const names = []; for await (const [n, h] of bd.entries()) if(h.kind === "file" && /^allotment-plan \d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
    names.sort(); while(names.length > 30){ await bd.removeEntry(names.shift()); }
  }catch(e){}
}
const safeParse = t => { try{ return JSON.parse(t); }catch(e){ return null; } };

/* ---------- reading: the plan file, plus any extra copies (e.g. "allotment-plan 2.json" saved from a phone) ---------- */
let syncing = false;
async function syncFromFolder(manual){
  if(!(F.mode === "folder" && F.dir && F.perm === "granted") || syncing) return 0;
  syncing = true; let changes = 0, copies = 0, from = ""; const fresh = !D;
  try{
    let fh = null; try{ fh = await F.dir.getFileHandle(PLAN_FILE); }catch(e){}
    let fileKey = "";
    if(fh){
      const file = await fh.getFile();
      if(file.lastModified !== F.stamp || manual){
        const other = safeParse(await file.text());
        if(isPlan(other)){ fileKey = contentKey(other); if(D){ const r = mergePlans(D, other); D = r.plan; changes += r.changes; if(r.changes) from = other.savedOn || ""; } else { D = normalise(other); changes++; } }
        F.stamp = file.lastModified;
      }
    }
    for await (const [name, h] of F.dir.entries()){
      if(h.kind !== "file" || name === PLAN_FILE || !/\.json$/i.test(name)) continue;
      const obj = safeParse(await (await h.getFile()).text()); if(!isPlan(obj)) continue;
      const r = mergePlans(D || emptyPlan(), obj); D = r.plan; changes += r.changes; copies++; if(r.changes) from = obj.savedOn || from;
      await moveAside(name, h);
    }
    const n = recalcAll(); _an = null;
    if(!fh || copies || n || (fileKey && fileKey !== contentKey(serialize()))) await writeFolder();
    saveWorking();
    if(changes) render();
    if(fresh && D) toast("Opened " + PLAN_FILE + " from " + (F.folderName || "your folder"));
    else if(manual || changes) toast(changes ? "Up to date: brought in " + plural(changes, "change") + (from ? " from your " + from : "") + (copies ? " (merged " + plural(copies, "extra copy", "extra copies") + ")" : "") : "Up to date: no changes from other devices");
  }catch(e){ F.err = e && e.message || String(e); if(e && e.name === "NotAllowedError") F.perm = "prompt"; }
  syncing = false; F.lastSync = Date.now(); updateStatus();
  return changes;
}
async function moveAside(name, h){
  try{
    const md = await F.dir.getDirectoryHandle("merged copies", {create:true});
    const fh = await md.getFileHandle(todayISO + " " + name, {create:true}); const w = await fh.createWritable(); await w.write(await (await h.getFile()).text()); await w.close();
    await F.dir.removeEntry(name);
  }catch(e){}
}
function checkOutside(){ if(F.mode === "folder" && F.perm === "granted" && Date.now() - F.lastSync > 2500) syncFromFolder(false); }

/* ---------- choosing / reconnecting the folder ---------- */
async function chooseFolder(){
  let dir;
  try{ dir = await window.showDirectoryPicker({id:"allotment-plan", mode:"readwrite"}); }catch(e){ if(e && e.name !== "AbortError") toast("Couldn't open that folder: " + e.message); return; }
  F.dir = dir; F.mode = "folder"; F.perm = "granted"; F.folderName = dir.name; F.stamp = 0;
  await kvSet("dir", dir); syncInfoSave();
  let hasPlan = false; try{ await dir.getFileHandle(PLAN_FILE); hasPlan = true; }catch(e){}
  if(!hasPlan && !D){ UI.needStart = true; render(); return; }
  await syncFromFolder(true);
  UI.needStart = false; render();
}
async function reconnect(){
  if(!F.dir) return chooseFolder();
  try{ const p = await F.dir.requestPermission({mode:"readwrite"}); F.perm = p; }catch(e){ F.perm = "prompt"; }
  if(F.perm === "granted"){ await syncFromFolder(true); render(); } else updateStatus();
}
async function forgetFolder(){ await kvDel("dir"); F.dir = null; F.mode = "copy"; F.perm = ""; F.folderName = ""; syncInfoSave(); render(); toast("Folder disconnected; the plan is still saved in this browser"); }

/* ---------- copy mode: open a plan file / save it back (iPhone, Safari, anywhere without folder access) ---------- */
function pickFile(){ return new Promise(res => { const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json,text/plain"; inp.onchange = () => res(inp.files && inp.files[0] || null); inp.click(); }); }
async function openPlanFile(){
  const f = await pickFile(); if(!f) return;
  const obj = safeParse(await f.text());
  if(!isPlan(obj)){ toast("That file isn't a plan from this planner."); return; }
  const before = D ? contentKey(serialize()) : "";
  let changes = 0;
  if(D){ const r = mergePlans(D, obj); D = r.plan; changes = r.changes; } else { D = normalise(obj); changes = 1; }
  recalcAll(); _an = null;
  if(F.mode !== "folder") F.mode = "copy";
  F.openedAt = new Date().toISOString();
  F.unsynced = contentKey(serialize()) !== contentKey(obj);
  syncInfoSave(); saveWorking();
  if(F.mode === "folder") await writeFolder();
  UI.needStart = false; render();
  toast(before ? (changes ? "Merged " + plural(changes, "change") + " from " + f.name : "Already up to date with " + f.name) : "Opened " + f.name);
}
async function saveToFiles(){
  const blob = new Blob([planJSON()], {type:"application/json"});
  const ok = await deliver(blob, PLAN_FILE, true);
  if(ok){ F.unsynced = false; F.savedToFilesAt = new Date().toISOString(); syncInfoSave(); updateStatus(); if(F.mode !== "folder") render(); }
}
/* hand a file to the person: the share sheet on phones (Save to Files), a download elsewhere */
async function deliver(blob, name, preferShare){
  const file = new File([blob], name, {type:blob.type || "application/octet-stream"});
  if((preferShare || isTouch()) && navigator.canShare && navigator.share){
    try{ if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return true; } }
    catch(e){ if(e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

/* ---------- status pill ---------- */
function ago(d){ if(!d) return ""; const t = typeof d === "string" ? Date.parse(d) : +d; const s = Math.round((Date.now() - t) / 1000); if(s < 50) return "just now"; if(s < 3600) return Math.round(s / 60) + " min ago"; const dd = new Date(t); if(iso(dd) === todayISO) return "at " + pad(dd.getHours()) + ":" + pad(dd.getMinutes()); return fmt(iso(dd)); }
function statusInfo(){
  if(F.mode === "folder"){
    if(F.perm !== "granted") return {cls:"bad", text:F.perm === "lost" ? "Plan folder not found" : "Plan folder needs reconnecting", act:"reconnect", actText:"Reconnect"};
    if(F.saving || F.pending) return {cls:"", text:"Saving…"};
    if(F.err) return {cls:"bad", text:"Not saved: " + F.err, act:"reconnect", actText:"Try again"};
    return {cls:"", text:"Saved in " + (F.folderName || "your folder") + (F.lastSaved ? " " + ago(F.lastSaved) : "")};
  }
  if(F.mode === "copy") return F.unsynced ? {cls:"local", text:"Changes not yet saved to Files", act:"save-files", actText:"Save to Files"} : {cls:"", text:F.savedToFilesAt ? "Saved to Files " + ago(F.savedToFilesAt) : "Up to date with your plan file"};
  return {cls:"local", text:"Not saved to a file yet"};
}
function updateStatus(){
  const el = $("#file-pill"); if(!el) return;
  const s = statusInfo();
  el.className = "save-pill " + s.cls; el.textContent = s.text;
  const ta = $("#top-actions"); if(ta) ta.classList.toggle("has-act", !!s.act);
  const b = $("#file-act"); if(b){ b.hidden = !s.act; if(s.act){ b.dataset.action = s.act; b.textContent = s.actText; } }
}
setInterval(updateStatus, 30000);

/* ---------- start-up ---------- */
async function bootFiles(){
  syncInfoLoad();
  let work = await kvGet("working"); if(typeof work !== "string") work = lsGet(LS_WORK);
  const w = safeParse(work); if(isPlan(w)) D = normalise(w);
  if(canFolder()){
    const dir = await kvGet("dir");
    if(dir && typeof dir.queryPermission === "function"){
      F.dir = dir; F.mode = "folder"; F.folderName = dir.name;
      try{ F.perm = await dir.queryPermission({mode:"readwrite"}); }catch(e){ F.perm = "prompt"; }
      if(F.perm === "granted") await syncFromFolder(false);
    } else if(D) F.mode = "copy";
  } else if(D) F.mode = "copy";
}

/* ===================== views: rendering, this week, plot, timeline, plantings, nursery ===================== */
let rq = 0;
function scheduleRender(){ if(rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
const BOUND = ["data-set","data-bed-field","data-dm","data-filter","data-cap","data-meta"];
function capture(root){
  const a = document.activeElement;
  const bound = el => BOUND.some(k => el.hasAttribute(k));
  const vals = {}; $$("input,select,textarea", root).forEach(el => { if(el.id && !["checkbox","radio","range","file"].includes(el.type) && (el === a || !bound(el))) vals[el.id] = el.value; });
  const focus = a && root.contains(a) && a.id ? {id:a.id, s:a.selectionStart, e:a.selectionEnd} : null;
  const scrolls = {}; $$("[data-keep-scroll]", root).forEach(el => { if(el.id) scrolls[el.id] = el.scrollLeft; });
  return {vals, focus, scrolls, key:UI.view, y:window.scrollY};
}
function restore(root, st){
  if(st.key !== UI.view) return;
  for(const id in st.vals){ const el = document.getElementById(id); if(el && root.contains(el) && el.value !== st.vals[id]){ try{ el.value = st.vals[id]; }catch(e){} } }
  for(const id in st.scrolls){ const el = document.getElementById(id); if(el) el.scrollLeft = st.scrolls[id]; }
  if(st.focus){ const el = document.getElementById(st.focus.id); if(el){ el.focus({preventScroll:true}); try{ if(st.focus.s != null) el.setSelectionRange(st.focus.s, st.focus.e); }catch(e){} } }
  if(Math.abs(window.scrollY - st.y) > 2) window.scrollTo(0, st.y);
}
function updateHeader(){
  $("#brand-name").textContent = D ? (D.meta.name || "Allotment planner") : "Allotment planner";
  const bits = []; if(D){ if(D.meta.location) bits.push(D.meta.location); bits.push("Season " + planYear()); const v = D.meta.activeVersion && D.versions[D.meta.activeVersion]; if(v) bits.push("Version: " + v.name); }
  $("#brand-sub").textContent = bits.join(" · ") || "Plan, sow, plant, pick";
  const ready = !!D && !UI.needStart;
  $("#tabs").hidden = !ready; $("#top-actions").hidden = !ready;
  $$(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.view === UI.view ? "page" : "false"));
  updateStatus();
}
const VIEWS = {};
function render(){
  const main = $("#main"); const st = capture(main);
  _an = null; todayISO = iso(new Date()); thisWeek = wk(todayISO);
  updateHeader();
  if(!D || UI.needStart){ main.innerHTML = welcomeHTML(); return; }
  const v = VIEWS[UI.view] || VIEWS.week;
  main.innerHTML = v.html(); if(v.after) v.after();
  restore(main, st);
  if(ED && ED.refresh) ED.refresh();
}

/* ---------- shared bits ---------- */
function bedOptions(sel, noneLabel){
  let h = noneLabel === null ? "" : opt("", noneLabel || "Not placed yet", !sel);
  for(const g of groupsOrdered()){ const bs = bedsOrdered().filter(b => (b.group || "Other spaces") === g); h += '<optgroup label="' + esc(g) + '">' + bs.map(b => opt(b.id, b.name + (b.built === false ? (b.readyFrom ? " (ready " + fmtY(b.readyFrom) + ")" : " (not built)") : ""), b.id === sel)).join("") + "</optgroup>"; }
  return h;
}
function cropOptions(sel, blank, withLib){
  let h = opt("", blank || "Choose a crop…", !sel);
  for(const f of FAMILIES){ const cs = Object.values(D.crops).filter(c => famOfCrop(c) === f.id).sort((a, b) => a.name.localeCompare(b.name)); if(!cs.length) continue; h += '<optgroup label="' + esc(f.name) + '">' + cs.map(c => opt(c.id, c.name, c.id === sel)).join("") + "</optgroup>"; }
  if(withLib){ const mine = new Set(Object.values(D.crops).map(c => c.lib)); const more = LIB.filter(L => !mine.has(L.id)).sort((a, b) => a.name.localeCompare(b.name)); if(more.length) h += '<optgroup label="More crops from the guide">' + more.map(L => opt("lib:" + L.id, L.name, "lib:" + L.id === sel)).join("") + "</optgroup>"; }
  return h;
}
function weekOptions(sel){ const ws = seasonWeeks().slice(); if(sel && !ws.includes(sel)) ws.push(sel); ws.sort(); return ws.map(w => opt(w, "w/c " + fmtY(w), w === sel)).join(""); }
const famOptions = (sel, any) => (any ? opt("", any, !sel) : "") + FAMILIES.map(f => opt(f.id, f.name, f.id === sel)).join("");
const dot = f => '<span class="dot fam-' + f + '"></span>';
function stepSeq(p){ return STEPS.filter(x => !(x === "plantOut" && isDirect(methodOf(p)))); }
function nextStep(p){ if(p.failed) return null; const dn = p.done || {}; return stepSeq(p).find(x => !dn[x]) || null; }
function markLabel(p, st){ const m = methodOf(p); if(st === "sow") return m === "chit" ? "Mark chitting" : m === "sets" || m === "buy" ? "Mark planted" : "Mark sown"; return "Mark " + STEP_DONE[st]; }
function markBtn(p){ const st = nextStep(p); if(!st) return ""; return '<button class="mark-btn" data-action="mark-step" data-id="' + esc(p.id) + '" data-step="' + st + '">' + markLabel(p, st) + "</button>"; }
function flagsHTML(a){ if(!a) return ""; return (a.clash.length ? '<span class="flag flag-clash" title="' + esc("Overlaps " + a.clash.map(x => x.label).join(", ")) + '">Clash</span> ' : "") + (a.rot ? '<span class="flag flag-rot">Rotation</span> ' : "") + (a.frost ? '<span class="flag flag-frost">' + (a.frost === "late" ? "Late frost" : "Frost") + "</span> " : "") + (a.unready ? '<span class="flag flag-rot">Bed not ready</span> ' : "") + (a.order ? '<span class="flag flag-rot">Dates</span>' : ""); }
function group(title, list, cls, showDate, empty){ return '<div class="group"><div class="group-h ' + (cls || "") + '"><h3>' + title + '</h3><span class="mono small muted">' + list.filter(i => i.done).length + "/" + list.length + " done</span></div>" + (list.length ? '<ul class="items">' + list.map(i => itemHTML(i, showDate)).join("") + "</ul>" : '<p class="hint" style="padding:8px 0">' + (empty || "Nothing on the list.") + "</p>") + "</div>"; }
function itemHTML(it, showDate){
  const isStep = it.type === "step";

function nurseryChartSVG(r, sel){

    s += '<line x1="' + LW + '" x2="' + (W - 4) + '" y1="' + (y0 + RH) + '" y2="' + (y0 + RH) + '" class="nc-base"/>';
    data.forEach((d, i) => { const v = d[k]; const bx = LW + i * (BW + GAP); const h = v * sc; const over = capN && v > capN; s += '<g data-action="nur-week" data-w="' + d.w + '" class="nc-col' + (d.w === sel ? " sel" : "") + '"><rect x="' + bx + '" y="' + (y0) + '" width="' + BW + '" height="' + RH + '" class="nc-hit"/>' + (v ? '<rect x="' + bx + '" y="' + (y0 + RH - h) + '" width="' + BW + '" height="' + h + '" rx="2" class="nc-bar' + (over ? " over" : "") + '"><title>' + esc("w/c " + fmtY(d.w) + ": " + num(v) + " trays " + LOCS[k].short.toLowerCase()) + "</title></rect>" : "") + "</g>"; });
    if(capN){ const cy = y0 + RH - capN * sc; s += '<line x1="' + LW + '" x2="' + (W - 4) + '" y1="' + cy + '" y2="' + cy + '" class="nc-cap"/>'; }
  });
  const yb = TOP + locs.length * (RH + 14) + 12; let lastM = -1;
  let lastX = -99; weeks.forEach((w, i) => { const d = parseD(w); if(d.getMonth() !== lastM){ lastM = d.getMonth(); const xx = LW + i * (BW + GAP); if(xx - lastX < 30) return; lastX = xx; s += '<text x="' + xx + '" y="' + yb + '" class="nc-m">' + MON[d.getMonth()] + "</text>"; } });
  const tw = weeks.indexOf(thisWeek); if(tw >= 0) s += '<line x1="' + (LW + tw * (BW + GAP) + BW / 2) + '" x2="' + (LW + tw * (BW + GAP) + BW / 2) + '" y1="0" y2="' + (H - 18) + '" class="nc-now"/>';
  return s + "</svg></div>";
}

function openGrowMore(id){

  const sug = [];

  const per = sug.length ? r1(Math.max(0.3, areaShort / Math.max(1, Math.min(3, sug.filter(s => s.rec).length || 1)))) : 0;
  ED = {type:"grow", id, sug};
  showDrawer("Grow more " + dm.name.toLowerCase(), '<p>' + (c0.status === "none" ? "Nothing is planned for this yet." : "The plan gives about " + r1(c0.expectKg) + " kg of the " + r1(c0.needKg) + " kg you want" + (c0.weeksShort ? ", and leaves weeks with nothing to pick" : "") + ".") + " About " + r1(areaShort) + " m² more would cover it.</p>" +
    (sug.length ? '<div class="field"><span class="label">Sowings to add <span class="hint">ticked: the usual pattern for this crop</span></span><ul class="plain">' + sug.map((s, i) => '<li><label class="check-line" style="flex:1"><input type="checkbox" id="gm-' + i + '"' + (s.rec ? " checked" : "") + ">" + dot(famOfCrop(s.c)) + '<span><b>' + esc(s.c.name) + "</b> · " + esc(s.x.w.label) + ' <span class="muted">sow ' + fmtY(s.x.t.sow) + " · pick " + fmtY(s.x.t.harvestFrom) + "–" + fmtY(s.x.t.clearBy) + "</span></span></label></li>").join("") + '</ul></div><div class="field" style="max-width:220px"><label for="gm-area">Space for each (m²)</label><input type="number" min="0.1" step="0.1" id="gm-area" value="' + per + '"></div><p class="hint">They are fitted into free space automatically; any that don’t fit wait in “Not placed yet”.</p>' : '<p class="hint">No more sowing windows left for these crops this season.</p>'),
    '<span class="spacer"></span><button type="button" class="btn" data-action="close-drawer">Cancel</button>' + (sug.length ? '<button type="button" class="btn btn-primary" data-action="gm-add">Add and fit them in</button>' : ""));
