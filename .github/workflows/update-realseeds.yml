# Once a week, read the Real Seeds catalogue and update data/realseeds.js.
# Run it by hand from the Actions tab: "Update Real Seeds catalogue" > Run workflow.
name: Update Real Seeds catalogue
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python scripts/update_realseeds.py
      - name: Save any changes
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/realseeds.js data/realseeds.json
            git commit -m "Update Real Seeds catalogue"
            git push
          else
            echo "Catalogue unchanged."
          fi
