<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Allotment Planner</title>
<meta name="description" content="A simple planner for your allotment or veg beds: when to sow, plant and pick, using Huw Richards' and Real Seeds' sowing calendars.">
<meta name="theme-color" content="#2B6643">
<link rel="icon" href="favicon.svg">
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="3" width="11" height="15" rx="1" fill="none" stroke="#8A6A4F" stroke-width="2.2"/><rect x="17" y="3" width="11" height="15" rx="1" fill="#2B6643" stroke="#8A6A4F" stroke-width="2.2"/><rect x="2" y="21" width="26" height="6" rx="1" fill="none" stroke="#8A6A4F" stroke-width="2.2"/></svg>
      <div style="min-width:0"><b id="plan-name">Allotment Planner</b><div class="save-note" id="saved"></div></div>
    </div>
    <nav class="nav" aria-label="Main">
      <button data-view="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>To do</button>
      <button data-view="garden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1"/><rect x="14" y="4" width="7" height="16" rx="1"/></svg>Beds</button>
      
      <button data-view="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-view="crops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21V11"/><path d="M12 11c0-4 3-7 8-7 0 5-3 7-8 7z"/><path d="M12 14c0-3-2-5-7-5 0 4 2 5 7 5z"/></svg>Crops</button>
    </nav>
    <button id="gear" class="gear" data-view="more" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<div class="wrap"><p class="note warn" id="link-banner" hidden style="margin-top:14px">Your linked plan file needs permission again. <button class="btn small" data-act="reconnect">Reconnect</button></p></div>
<main class="wrap" id="main"><noscript>This planner needs JavaScript switched on.</noscript></main>
<script src="data/crops.js"></script>
<script src="data/realseeds.js"></script>
<script src="app.js"></script>
</body>
</html>
